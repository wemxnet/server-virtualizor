name: Package release

on:
  release:
    types: [published]
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 1.0.0
        required: true

jobs:
  package:
    name: Attach Virtualizor.zip
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Package files into a Virtualizor folder
        run: |
          mkdir -p build/Virtualizor
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="build" \
            --exclude=".DS_Store" \
            ./ build/Virtualizor/
          (
            cd build
            zip -r Virtualizor.zip Virtualizor
          )
          unzip -l build/Virtualizor.zip

      - name: Upload zip to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.event.release.name || inputs.version || github.ref_name }}
          files: build/Virtualizor.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
